; F.O.R.C.E firmware (ESP32 DevKit, ESP-WROOM-32). Arduino framework + NimBLE-Arduino.
; Versions are pinned: do not float them.

[platformio]
default_envs = esp32dev

[env]
build_flags =
    -Iinclude
    -Wall
    -Wextra

; ---- Host-side unit tests (no hardware, runs in CI):  pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags =
    ${env.build_flags}
    -std=gnu++17

; ---- Real firmware with the real INA219 sensor
[env:esp32dev]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    h2zero/NimBLE-Arduino@2.3.9
build_unflags = -std=gnu++11
build_flags =
    ${env.build_flags}
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0

; ---- Same firmware, synthetic footstep signal instead of the sensor (no INA219 needed)
[env:esp32dev_bench]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DBENCH_MODE=1

; ---- Same firmware at a higher sample rate (decide with tools/ble_check.html pulse check)
[env:esp32dev_50hz]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DSAMPLE_RATE_HZ=50

[env:esp32dev_100hz]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DSAMPLE_RATE_HZ=100

; ---- TRIAL ONLY: shunt value taken from the INA219 datasheet calibration Example 1
;      (500 mohm x 0.63484 A / 0.55 A = 577 mohm). NOT a measurement of our hardware.
[env:esp32dev_datasheet_trial]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DINA219_SHUNT_MOHM=577
